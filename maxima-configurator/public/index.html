<!doctype html>
<html lang="nl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maxima configurator | Klop Watersport</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/configurator.css">
  <script>
    // Instellingen voor deze installatie. Pas aan bij integratie in klopwatersport.nl.
    window.KLOP_CONFIG = {
      dataPath: 'data/',
      endpoint: 'api/offerte.php',           // POST-endpoint voor offerte/hulpaanvragen
      email: 'verkoop@klopwatersport.nl',    // fallback (mailto) als het endpoint niet bereikbaar is
      phone: '+31184612227',
      phoneLabel: '+31 (0)184 - 61 22 27',
      whatsapp: '31633180500',
      backUrl: 'https://www.klopwatersport.nl/maxima-boats/'
    };
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="site-header__logo" href="https://www.klopwatersport.nl/" aria-label="Klop Watersport">
        <img src="assets/klop-logo.svg" alt="Klop Watersport" width="77" height="56">
      </a>
      <nav class="site-header__nav" aria-label="Snelkoppelingen">
        <a href="#" data-nav="overview">Alle Maxima modellen</a>
        <a class="site-header__phone" data-phone-link href="tel:+31184612227">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg>
          <span data-phone-label>+31 (0)184 - 61 22 27</span>
        </a>
      </nav>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite">
    <div class="app__loading"><span class="spinner"></span> Configurator laden…</div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>Klop Watersport · Rivierdijk 27a · 3372 BE Hardinxveld-Giessendam</span>
      <span>Prijzen onder voorbehoud van wijzigingen en typefouten. Afbeeldingen zijn een impressie.</span>
    </div>
  </footer>

  <script src="assets/configurator.js" defer></script>
