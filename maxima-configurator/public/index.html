<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a23">
  <title>Stel je Maxima samen | Klop Watersport</title>
  <meta name="description" content="Stel je eigen Maxima samen: kies romp, kussens, buiskap, motor en opties, zie direct je prijs en vraag een vrijblijvende offerte aan bij Klop Watersport.">
  <link rel="icon" type="image/svg+xml" href="assets/maxima-beeldmerk-goud.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/configurator.css">
  <script>
    // Instellingen voor deze installatie.
    window.MX_CONFIG = {
      dataPath: 'data/',
      endpoint: 'api/offerte.php',            // POST-endpoint voor offerte- en hulpaanvragen
      dealer: 'Klop Watersport',
      email: 'verkoop@klopwatersport.nl',     // fallback (mailto) als het endpoint niet bereikbaar is
      phone: '+31184612227',
      phoneLabel: '0184 - 61 22 27',
      whatsapp: '31633180500',
      address: 'Rivierdijk 27a, 3372 BG Hardinxveld-Giessendam'
    };
    // Embed-modus (iframe in de Klop-site): geen eigen kop en voet.
    if (/[?&]embed=1\b/.test(location.search)) document.documentElement.classList.add('is-embed');
  </script>
</head>
<body>
  <a class="skip" href="#app">Naar de configurator</a>
  <header class="mx-head">
    <div class="wrap mx-head__in">
      <a class="mx-head__logo" href="?" data-nav="overview" aria-label="Alle Maxima-modellen">
        <img src="assets/maxima-logo-wit.svg" alt="Maxima Boats" width="98" height="40">
      </a>
      <span class="mx-head__label">Configurator</span>
      <div class="mx-head__dealer">
        <span class="mx-head__by">Dealer <b data-dealer>Klop Watersport</b></span>
        <a class="mx-head__phone" data-phone-link href="tel:+31184612227"><span data-phone-label>0184 - 61 22 27</span></a>
      </div>
    </div>
  </header>

  <main id="app" class="app" tabindex="-1">
    <div class="app__loading"><span class="spinner"></span> Configurator laden…</div>
  </main>

  <footer class="mx-foot">
    <div class="wrap mx-foot__in">
      <span>Maxima Boats via <b data-dealer>Klop Watersport</b> · <span data-address>Rivierdijk 27a, 3372 BG Hardinxveld-Giessendam</span></span>
      <span>Prijzen zijn een indicatie, onder voorbehoud van wijzigingen en typefouten. Afbeeldingen zijn een impressie.</span>
    </div>
  </footer>

  <script src="assets/configurator.js" defer></script>
</body>
</html>
